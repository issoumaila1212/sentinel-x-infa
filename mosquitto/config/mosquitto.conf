# Persistence
persistence true   #garde les messages en attente si le broker redémarre.
persistence_location /mosquitto/data/ 

# Logging
log_dest stdout  #les logs s'affichent dans docker compose logs.
log_timestamp true #log_timestamp_format %Y-%m-%d %H:%M:%S

# TLS only: there is no plain 1883 listener.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Only authenticated clients. The password file is built at startup (see docker-compose.yml).
allow_anonymous false
password_file /tmp/passwd
connection_messages true